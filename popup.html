<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --mt-accent: #4da6ff; /* JS ile üzerine yazılacak */
        }
        body { width: 320px; margin: 0; background: #1e1e1e; color: #e0e0e0; font-family: -apple-system, sans-serif; }
        
        .header-container { display: flex; border-bottom: 1px solid #333; background: #252525; align-items: center; }
        .tabs { display: flex; flex: 1; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #888; font-size: 13px; font-weight: bold; transition: background 0.2s, color 0.2s; user-select: none; }
        .tab:hover { background: #2a2a2a; }
        
        /* Aktif sekme artık seçili rengi alacak */
        .tab.active { color: var(--mt-accent); border-bottom: 2px solid var(--mt-accent); background: #1e1e1e; }
        
        .settings-btn { background: none; border: none; color: #888; cursor: pointer; padding: 0 12px; height: 100%; display: flex; align-items: center; justify-content: center; transition: color 0.2s; border-left: 1px solid #333; }
        
        /* Çark ikonuna gelince renk seçili renk olacak */
        .settings-btn:hover { color: var(--mt-accent); }

        .list { list-style: none; padding: 0; margin: 0; max-height: 350px; overflow-y: auto; display: none; }
        .list.active { display: block; }
        .history-item { padding: 12px 15px; border-bottom: 1px solid #333; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: background 0.2s; }
        .history-item:hover { background: #2a2a2a; }
        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
        .delete-btn { color: #888; font-size: 18px; line-height: 1; margin-left: 8px; cursor: pointer; border-radius: 4px; padding: 0 4px; }
        .delete-btn:hover { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }
        .url { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty { padding: 20px; text-align: center; color: #888; font-size: 13px; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1e1e1e; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header-container">
        <div class="tabs">
            <div class="tab active" id="tabHist" data-i18n="historyTitle"></div>
            <div class="tab" id="tabBook" data-i18n="bookmarksTitle"></div>
        </div>
        <button id="settingsBtn" class="settings-btn" title="Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>
    <ul class="list active" id="listHist"></ul>
    <ul class="list" id="listBook"></ul>
    <script src="popup.js"></script>
</body>
</html>
